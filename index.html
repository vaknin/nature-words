/* Trail colours: three nature colours of equal weight (blue water, green trees, grey-blue rock), so none reads as
   higher or lower; no traffic lights. */
:root{--ink:#1f2a3d;--muted:#5d6b82;--bg:#f4f8fb;--card:#fff;--line:#e3e9f1;
--river:#2f80ed;--river-d:#1c5fb8;--river-t:#e5f0ff;
--forest:#1f9d63;--forest-d:#157549;--forest-t:#e2f6ec;
--rock:#5b7a99;--rock-d:#405a75;--rock-t:#e8eef5;
--sun:#ffc83d;--ok:#1f9d63;--soft:#ff8a65;
--head:"Fredoka","Rubik",system-ui,sans-serif;--body:"Rubik","Fredoka",system-ui,sans-serif;
--r:24px;--shadow:0 1px 0 #fff inset,0 10px 30px #1f2a3d14,0 2px 6px #1f2a3d0f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
svg{display:block}
[hidden]{display:none!important}
h1,h2,.mark,.sayline{text-wrap:balance}
h1,h2,h3,.head{font-family:var(--head)}
.he{direction:rtl;unicode-bidi:isolate;font-family:var(--body)}
.btn{transition:transform .16s cubic-bezier(.3,1.4,.5,1),box-shadow .16s}
/* Touch first. A lift on hover only where there is a real mouse; on a finger every button answers on press (:active),
   so the feedback comes the moment the finger lands, never only on hover. */
@media (hover:hover) and (pointer:fine){.btn:hover{transform:translateY(-3px)}}
button:not([disabled]):active{transform:translateY(2px) scale(.97)}
/* No double-tap zoom, no pinch zoom, no long-press menu or text selection on the kid screens. 48px: the common
   touch-target minimum (Material, WCAG 2.5.5); the smoke test fails any visible button under it. */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
.land,.trail,.offer{touch-action:pan-y;-webkit-touch-callout:none}
button{min-width:48px;min-height:48px;touch-action:manipulation}
input{user-select:text;-webkit-user-select:text}
.btn:active{transform:translateY(2px) scale(.98)}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
.pop{animation:popIn .4s cubic-bezier(.3,1.6,.5,1)}
.shake{animation:shake .3s}
.rise{animation:rise .45s ease both}
#app{min-height:100vh;display:flex;flex-direction:column}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- shared pieces ---------- */
.primary{font-family:var(--head);font-weight:600;font-size:26px;background:var(--c,var(--river));color:#fff;border-radius:999px;padding:14px 38px;box-shadow:0 6px 0 var(--d,var(--river-d))}
.speaker{flex:none;width:56px;height:56px;border-radius:50%;background:var(--c,var(--river));display:grid;place-items:center;box-shadow:0 5px 0 var(--d,var(--river-d))}
.speaker svg{width:28px;height:28px}
/* The listen tile: its own class, never "big" (the picture box's class), whose white fill once hid the white icon. */
.speaker.xl{width:112px;height:112px;box-shadow:0 7px 0 var(--d,var(--river-d)),0 0 0 10px var(--t,var(--river-t))}
.speaker.xl svg{width:58px;height:58px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.say{display:flex;align-items:center;gap:16px;padding:14px 20px}
.say .en{font-family:var(--head);font-weight:600;font-size:26px}
.say>div{display:flex;flex-direction:column}
.say .he{display:block;text-align:right;font-size:19px;color:var(--muted);margin-top:2px}

/* ---------- start: the nature map and the trail quiz ---------- */
.land{position:relative;flex:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;padding:24px}
.land .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.land>*:not(.scene){position:relative;z-index:1}
.hero{text-align:center;padding:26px 44px;background:#ffffffe8;backdrop-filter:blur(6px);border-radius:32px;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:64px;font-weight:700;letter-spacing:.5px}
.hero p{margin:6px 0 0;font-size:24px;color:var(--muted)}
.hero .he{font-size:21px;color:var(--muted);margin-top:4px}
.hero .primary{margin-top:18px}
/* Full screen beside Start: the school laptops' browser bars eat about a sixth of a 720px screen, so every kid is
   asked to go full screen first. Lighter than Start (white, outlined) so Start stays the one big colour button. */
.gorow{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.fsbtn{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-family:var(--head);font-weight:600;font-size:22px;border-radius:999px;padding:12px 26px;background:#fff;box-shadow:inset 0 0 0 3px var(--line),0 5px 0 var(--line)}
.fsbtn svg{width:26px;height:26px}
.fshint{display:inline-flex;align-items:center;gap:12px;margin-top:14px;padding:8px 18px 8px 10px;border-radius:18px;background:var(--river-t);text-align:left}
.fshint svg{width:54px;height:40px;flex:none}
.fshint b{display:block;font-family:var(--head);font-weight:600;font-size:20px}
.fshint .he{display:block;text-align:right;font-size:17px;color:var(--muted);margin:0}
/* Once the page is full screen the button and its hint have done their job. */
:fullscreen [data-fs-start],:fullscreen [data-fs-hint],.isfs [data-fs-start],.isfs [data-fs-hint]{display:none}
.trailtags{display:flex;gap:12px}
.tag{display:inline-flex;align-items:center;gap:8px;background:#ffffffe0;border-radius:999px;padding:6px 16px 6px 6px;font-family:var(--head);font-weight:600;font-size:20px}
.tag svg{width:36px;height:36px}
.quiz{width:min(960px,94vw);display:flex;flex-direction:column;gap:18px;padding:22px 28px;background:#ffffffee;border-radius:32px;box-shadow:var(--shadow)}
.qtop{display:flex;align-items:center;gap:14px}
.qtop h2{margin:0;font-size:30px;font-weight:600}
.qtitle{display:flex;flex-direction:column}
.qtitle .he{text-align:right;font-size:19px;color:var(--muted);margin-top:2px}
.steps{margin-left:auto;display:flex;gap:8px}
.steps i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--sun)}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 50px}
.result .badge{width:150px;height:150px}
.result h1{margin:0;font-size:54px}
.result p{margin:0;font-size:22px;color:var(--muted)}

/* ---------- a trail ---------- */
.trail{flex:1;min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:14px 32px 16px;background:linear-gradient(180deg,var(--t) 0,var(--bg) 60%)}
.thead{display:flex;align-items:center;gap:14px;min-height:56px}
.thead .pic{width:52px;height:52px}
.thead>b{display:block;font-family:var(--head);font-weight:600;font-size:30px}
.thead .he{font-size:16px;color:var(--muted)}
.path{margin-left:auto;margin-right:6px;display:flex;align-items:center;gap:6px}
.path i{width:34px;height:10px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.path i.done{background:var(--c);box-shadow:none}
.path i.cur{background:var(--sun);box-shadow:none}
.stars{font-family:var(--head);font-weight:600;font-size:22px;background:#fff;border-radius:999px;padding:6px 16px;box-shadow:var(--shadow)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.big{width:min(250px,30vh);height:min(250px,30vh);background:#fff;border-radius:32px;padding:14px;box-shadow:var(--shadow)}
.big svg{width:100%;height:100%}
/* 1180px: six words or six pictures stay on one row at 1280px, so a second row never runs into the word cards. */
.choices{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:1180px}
.choice{background:#fff;border-radius:22px;box-shadow:0 0 0 3px var(--line),0 6px 0 var(--line);font-family:var(--head);font-weight:600;font-size:30px;padding:14px 26px;min-width:150px;display:flex;align-items:center;justify-content:center;gap:10px}
.choice.pic{padding:10px}
.choice.pic svg{width:min(150px,20vh);height:min(150px,20vh)}
/* Six pictures: smaller, so all six fit one row (6 x 150px + gaps is wider than a 1280px screen's stage). */
.choices.six .choice.pic svg{width:min(128px,18vh);height:min(128px,18vh)}
.choices.six .choice{min-width:132px;padding-left:18px;padding-right:18px}
/* A word's own speaker sits beside its word as a button of its own (inside the word a finger hit it by mistake). */
.opt{display:inline-flex;align-items:center;gap:10px}
.opt .mini{width:52px;height:52px;border-radius:50%;background:var(--t);display:grid;place-items:center;box-shadow:0 4px 0 var(--line)}
.opt .mini svg{width:26px;height:26px}
/* Build: tiles can be tapped or dragged to the slots; the drag area takes every touch (no scroll, no zoom). */
.tiles,.tile{touch-action:none}
.slot.next{box-shadow:inset 0 0 0 3px var(--c);background:var(--t)}
.slots.over .slot.next{box-shadow:inset 0 0 0 4px var(--sun)}
.dragtile{position:fixed;z-index:40;pointer-events:none;width:58px;height:66px;border-radius:16px;display:grid;place-items:center;font-family:var(--head);font-size:40px;font-weight:600;background:var(--c);color:#fff;box-shadow:0 14px 30px #1f2a3d55;transform:scale(1.12) rotate(-4deg)}
.choice.ok{box-shadow:0 0 0 4px var(--ok),0 6px 0 var(--ok)}
.slots,.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot,.tile{width:58px;height:66px;border-radius:16px;display:grid;place-items:center;font-family:var(--head);font-size:40px;font-weight:600}
.buildrow{display:flex;align-items:center;gap:18px}
.slot{background:#fff;box-shadow:inset 0 0 0 3px var(--line)}
.slot.f{box-shadow:inset 0 0 0 3px var(--ok);color:var(--ok)}
.slot.given{color:var(--muted)}
.tile{background:var(--c);color:#fff;box-shadow:0 5px 0 var(--d)}
.tile[disabled]{visibility:hidden}
.gap{font-family:var(--head);font-weight:600;font-size:38px;text-align:center;background:#fff;border-radius:24px;padding:18px 30px;box-shadow:var(--shadow)}
.gap u{display:inline-block;min-width:3.5em;text-decoration:none;border-bottom:5px solid var(--c,var(--river))}
.cheer{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.cheer h2{margin:0;font-size:50px}
.next-trail{display:inline-flex;align-items:center;gap:10px}
.next-trail svg{width:40px;height:40px}
.offer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#1f2a3d66}
.offer .card{padding:28px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:620px}
.offer h2{margin:0;font-size:38px}
.offer .row,.cheer .row{display:flex;gap:14px;align-items:center}
.ghost{font-family:var(--head);font-weight:600;font-size:22px;border-radius:999px;padding:12px 28px;background:#fff;box-shadow:inset 0 0 0 3px var(--line)}

/* ---------- points, combo, cards, race ---------- */
/* 44px: the height of every header pill and chip, one line so the header reads as a single clean row. */
/* One points pill: a star and the points, "Level N" once he has one, and a thin line along its bottom filling
   toward the next level. The combo pill shows only from x2. */
.hud{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;height:44px;background:#fff;border-radius:999px;padding:0 16px 0 10px;box-shadow:var(--shadow)}
.hud .st{width:28px;height:28px}
.hud .pts{font-size:24px;font-weight:600;min-width:2ch}
.hud .lvl{font-size:15px;font-weight:600;color:var(--d,var(--river-d));background:var(--t,var(--river-t));border-radius:999px;padding:3px 10px;margin-left:2px}
.hud .xp{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
.hud .xp i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ff8a3d);transition:width .4s}
.hud .combo{font-size:17px;font-weight:600;color:#fff;background:#ff8a3d;border-radius:999px;padding:3px 10px;animation:popIn .3s}
.path i.race{width:auto;height:auto;background:none;box-shadow:none;font-style:normal;font-size:18px;opacity:.5}
.path i.race.cur{opacity:1}
.cards{display:flex;gap:8px;justify-content:center}
/* Word cards 44px pictures: still readable at a glance, and the strip stays under 90px so it fits a 720px screen. */
.wc{width:72px;background:#fff;border-radius:14px;padding:4px;text-align:center;box-shadow:inset 0 0 0 2px var(--line);font-family:var(--head);font-size:14px}
.wc svg{width:44px;height:44px;margin:auto;filter:grayscale(1);opacity:.25}
.wc.got{box-shadow:0 0 0 3px var(--sun),0 4px 12px #ffc83d55}
.wc.got svg{filter:none;opacity:1}
.float{position:absolute;font-size:40px;font-weight:700;color:#e8590c;pointer-events:none;animation:floatUp .9s ease-out forwards}
.stage{position:relative}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
.toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:22px;padding:12px 26px 12px 14px;box-shadow:0 14px 40px #1f2a3d55}
.toast svg{width:60px;height:60px}
.toast small{display:block;color:var(--sun);font-family:var(--head);font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.toast b{font-family:var(--head);font-size:30px}
.burst{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--sun) 19% 45%,transparent 46%),conic-gradient(from 0deg,var(--sun) 0 10deg,transparent 10deg 30deg,var(--sun) 30deg 40deg,transparent 40deg 60deg,var(--sun) 60deg 70deg,transparent 70deg 90deg,var(--sun) 90deg 100deg,transparent 100deg 120deg,var(--sun) 120deg 130deg,transparent 130deg 150deg,var(--sun) 150deg 160deg,transparent 160deg 180deg,var(--sun) 180deg 190deg,transparent 190deg 210deg,var(--sun) 210deg 220deg,transparent 220deg 240deg,var(--sun) 240deg 250deg,transparent 250deg 270deg,var(--sun) 270deg 280deg,transparent 280deg 300deg,var(--sun) 300deg 310deg,transparent 310deg 330deg,var(--sun) 330deg 340deg,transparent 340deg);animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.endrow{display:flex;gap:24px;align-items:stretch;justify-content:center}
.racecard{width:400px;border-radius:28px;padding:22px;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;
 background:radial-gradient(circle at 30% 0,#ffdf7a 0,transparent 45%),linear-gradient(160deg,#ff8a3d,#e8590c 55%,#b8380a);box-shadow:0 18px 40px #e8590c55}
.racecard h2{margin:0;font-size:30px}
.racecard .he{color:#fff;opacity:.9}
.rc-icons{display:flex;gap:6px;font-size:58px;line-height:1}
.rc-icons .watch{animation:tickTock 1s ease-in-out infinite}
@keyframes tickTock{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.rc-rec{background:#ffffff26;border-radius:16px;padding:4px 20px}
.rc-rec small{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.rc-rec b{font-family:var(--head);font-size:44px;line-height:1}
.race-go{background:#fff;color:#e8590c;box-shadow:0 6px 0 #b8380a}
.racebar{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:8px 18px;box-shadow:var(--shadow);font-size:20px}
.racebar .trophy{font-size:28px}
.clock{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.clock i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a3d,var(--sun))}
.rscore{font-size:26px}
.big-t{font-size:70px}
.cheer .row{display:flex;gap:12px}

/* ---------- Fable's additions: say game, flag, end, teacher screens ---------- */
.sayline{font-family:var(--head);font-size:56px;font-weight:600;line-height:1.1}
.sayline.sent{font-size:36px;font-weight:500;text-align:center;max-width:900px}
.sayline b{color:var(--c)}
/* The word and its Hebrew are one block: the Hebrew sits in a soft pill of the trail colour right under it. */
.sayblock{display:flex;flex-direction:column;align-items:center;gap:10px}
.heword{display:inline-flex;align-items:center;gap:10px;font-size:24px;font-weight:500;color:var(--d,var(--river-d));background:var(--t,var(--river-t));box-shadow:inset 0 0 0 2px #ffffffaa;border-radius:999px;padding:4px 20px}
.heword .en{font-family:var(--head);font-weight:600;direction:ltr}
/* Listen, say it out loud, Next: one row of the same height. Nothing is recorded: the kid just says it. */
.rec{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.rec .primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:58px;padding:0 30px;font-size:24px}
.outloud{display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 22px 0 14px;border-radius:999px;background:var(--sun);box-shadow:0 5px 0 #d9a21a;animation:popIn .45s}
.outloud .mouth{font-size:30px;line-height:1}
.outloud b{font-family:var(--head);font-weight:600;font-size:22px;display:block;line-height:1.1}
.outloud .he{display:block;font-size:15px;color:#6b4e00;text-align:right}
.ghost[disabled]{opacity:.4}
.flag{font-family:var(--head);font-weight:600;font-size:20px;background:var(--sun);border-radius:999px;padding:0 20px;height:48px;margin-right:8px;box-shadow:0 5px 0 #d9a21a;animation:popIn .5s}
.mark{margin:0}
.cheer[data-done]{padding:26px 36px;width:440px;justify-content:center}
.cheer[data-done] h2{font-size:42px}
/* The race's end card holds its own buttons: padding on every side and a row that wraps, so Back never spills out. */
.cheer[data-raceend]{padding:22px 36px 26px;max-width:min(560px,92vw)}
.cheer[data-raceend] .row{flex-wrap:wrap;justify-content:center}
.mark{font-size:24px;line-height:1.25}
.tplace{display:inline-flex;align-items:center;gap:10px}
.tp{width:48px;height:48px;display:inline-block}
.tp svg{width:100%;height:100%}
/* The place pictures sit inside agenda pills: they take none of the pill's own padding and shadow. */
.agenda .tp{padding:0;background:none;box-shadow:none;border-radius:0}
.steps4 span{font-size:.85em}
.timer{width:min(1100px,92vw);display:flex;align-items:center;gap:16px}
.track{position:relative;flex:1;height:22px;border-radius:99px;background:var(--line)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--forest),var(--river))}
.walker{position:absolute;top:-30px;width:40px;font-size:32px;text-align:center}
.timer b{font-size:34px;min-width:3.2em}
.places{display:flex;gap:30px;justify-content:center}
.place{background:#fff;border-radius:30px;padding:16px;box-shadow:var(--shadow);text-align:center}
.place svg{width:min(34vmin,300px);height:min(34vmin,300px)}
.places.n4 .place svg{width:min(22vmin,220px);height:min(22vmin,220px)}
.place b{font-family:var(--head);font-size:clamp(28px,5vmin,52px)}
.wgrid .gone svg{visibility:hidden}
.wgrid .back{box-shadow:0 0 0 5px var(--sun)}
.wgrid span{display:block;min-height:1.2em}

/* ---------- rewards and race, Fable's follow-up ---------- */
/* The race chip: locked, a quiet round trophy with a small lock (Hebrew tooltip says when it opens); open, the orange RACE! button. */
.chip{position:relative;display:grid;place-items:center;font-weight:600;font-size:18px;border-radius:999px;height:48px;min-width:48px;padding:0 14px;background:#fff;box-shadow:var(--shadow);color:var(--muted);margin-left:8px}
.chip[disabled]{padding:0;width:48px;cursor:default;pointer-events:none}
.chip[disabled] .tr{font-size:22px;filter:grayscale(1);opacity:.55}
.chip[disabled] .lk{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.chip[disabled] .lk svg{width:12px;height:12px}
.chip.open{background:linear-gradient(160deg,#ff8a3d,#e8590c);color:#fff;box-shadow:0 4px 0 #b8380a;cursor:pointer}
.hud .combo.fire{background:#e8590c}
.wc i{display:block;font-style:normal;font-size:12px;color:var(--sun);letter-spacing:1px}
.wc.gold svg{filter:none;opacity:1}
.wc.gold{background:linear-gradient(160deg,#fff6d6,#ffe08a);box-shadow:0 0 0 3px var(--sun),0 4px 14px #ffc83d88}
.choice.bad{box-shadow:0 0 0 4px var(--soft),0 6px 0 var(--soft);opacity:.6}
.count{font-size:140px;font-weight:700;color:#e8590c;animation:popIn .4s}
.rc-nums{display:flex;gap:12px}
.rc-win{margin:0;font-size:22px}
.stage.comeback::before{content:"↺";position:absolute;top:-6px;right:8px;font-size:28px;color:var(--muted)}

/* ---------- race end and the board ---------- */
.cheer.raceend{flex-direction:row;align-items:stretch;gap:28px;text-align:left;padding:22px 28px;max-width:min(900px,94vw)}
.re-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:330px}
.re-left h2{font-size:40px;line-height:1.05}
.re-left .big-t{font-size:56px;line-height:1}
.board{width:340px;display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:20px;padding:14px 16px}
.bhead b{display:block;font-size:22px}
.bhead .he{display:block;text-align:right;font-size:15px;color:var(--muted)}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;background:#fff;border-radius:12px;font-size:20px;font-weight:500}
.board li .rk{width:28px;text-align:center;font-family:var(--head);font-weight:600;color:var(--muted)}
.board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .sc{font-size:22px}
.board li.me{background:var(--sun);box-shadow:0 4px 0 #d9a21a;animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
.board li.none{justify-content:center;color:var(--muted)}
.board .off{margin:0;font-size:14px;color:var(--muted)}
.board .off .he{display:block;text-align:right}
.nameform{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.nameform label b{display:block;font-family:var(--head);font-weight:600;font-size:22px}
.nameform label .he{display:block;font-size:16px;color:var(--muted)}
.nameform input{width:100%;height:64px;border:0;border-radius:18px;padding:0 18px;font:600 32px var(--head);color:var(--ink);text-align:center;background:#fff;box-shadow:inset 0 0 0 3px var(--c,var(--river))}
.nameform input:focus{outline:none;box-shadow:inset 0 0 0 4px var(--sun)}
.nameform .row{display:flex;gap:12px;align-items:center}
.re-left .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tbar .ib.wide{width:auto;padding:0 16px;gap:8px;display:inline-flex;font-family:var(--head);font-weight:600;font-size:17px;color:var(--muted)}

/* ---------- teacher (projector) ---------- */
.tbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;box-shadow:0 1px 0 var(--line)}
.tbar .num{display:grid;place-items:center;min-width:44px;height:44px;border-radius:999px;background:var(--river);color:#fff;font-family:var(--head);font-weight:600;font-size:24px}
.tbar .name{flex:1;font-family:var(--head);font-size:28px;font-weight:600}
.tbar .min{font-weight:600;color:var(--muted)}
.tbar .ib{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.tbar .ib svg{width:24px;height:24px}
.prog{display:flex;gap:8px;padding:20px 16px 0}
.prog button{flex:1;position:relative;min-width:0;height:48px;margin:-19px 0}
.prog button::after{content:"";position:absolute;left:0;right:0;top:19px;height:10px;border-radius:99px;background:var(--line)}
.prog button.done::after{background:#9cc2f5}
.prog button.cur::after{background:var(--river)}
.tscreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;min-height:calc(100vh - 100px)}
.title{font-family:var(--head);font-size:clamp(48px,9vmin,110px);font-weight:700;margin:0;text-align:center;line-height:1.05}
.sub{font-size:clamp(22px,4vmin,44px);font-weight:500;margin:0;text-align:center;color:var(--muted)}
.agenda{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-family:var(--head);font-size:clamp(18px,3vmin,30px);font-weight:600}
.agenda span{background:#fff;border-radius:999px;padding:8px 20px;box-shadow:var(--shadow)}
.wcard{display:flex;flex-direction:column;align-items:center;gap:10px}
.wcard .big{width:min(50vmin,360px);height:min(50vmin,360px)}
.wcard .w{font-family:var(--head);font-size:clamp(64px,12vmin,140px);font-weight:700;visibility:hidden;line-height:1}
.wcard .w.show{visibility:visible;animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
.wcard .g{font-size:clamp(20px,3vmin,30px);color:var(--muted);font-weight:500}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.wgrid div{background:#fff;border-radius:22px;padding:10px;box-shadow:var(--shadow);text-align:center;font-family:var(--head);font-weight:600;font-size:clamp(20px,3vmin,32px)}
.wgrid svg{width:min(17vmin,150px);height:min(17vmin,150px);margin:auto}
.keys{position:fixed;right:14px;bottom:8px;font-size:13px;color:#98a3b5;font-weight:500;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>

/* All phrases the site can speak: [text, voice]. Words in both voices (the kids hear a boy and a girl);
   every other line in one voice, boy and girl taking turns. tools/voices.py records exactly this list. */
function PHRASES(L) {
  const out = [];
  for (const w of L.words) out.push([w.id, "boy"], [w.id, "girl"]);
  // Fable's six spoken lines; everything else is text only (Mountain's reading lines, quiz, reveal, check, race).
  const lines = [];
  for (const k of Object.keys(L.games)) for (const g of L.games[k]) if (!g.mute && !lines.includes(g.say)) lines.push(g.say);
  lines.push(L.text.wellDone);
  lines.forEach((t, i) => out.push([t, i % 2 ? "girl" : "boy"]));
  return out;
}

    // Four rounds (Fable) leave time in the 4 minutes for the race shout-out and the sum-up.
    const ROUNDS = 4;
    let k = 0, hidden = null, summary = false;
    const grid = () => `<div class="wgrid">${W.map(w => `<div data-w="${w.id}" class="${w.id === hidden ? "gone" : ""}">${ART[w.id]}<span>${w.id === hidden ? "?" : ""}</span></div>`).join("")}</div>`;
    const show = () => { el.dataset.item = summary ? "summary" : String(k); el.innerHTML = summary
      ? `<h1 class="title">✓ ${LESSON.goal}</h1><div class="agenda">${W.map(w => `<span>${w.id}</span>`).join("")}</div><p class="sub">Classroom → Mark as done</p>`
      : `<h1 class="title">What's missing?</h1>${grid()}<div class="agenda"><span>${k + 1} / ${ROUNDS}</span></div>`; };
    const space = () => {
      if (summary) return;
      if (!hidden) { hidden = shuffle(WIDS)[0]; show(); return; }
      const w = hidden; hidden = null; show(); const c = $(`[data-w="${w}"]`, el); c.classList.add("back"); $("span", c).textContent = w; speak(w);
    };
    const next = () => { if (summary) return false; if (k < ROUNDS - 1) { k++; hidden = null; show(); return true; } summary = true; show(); return true; };
    show();
    return { keys: "Space: hide / show", space, next, prev: () => { if (summary) { summary = false; show(); return true; } if (k > 0) { k--; hidden = null; show(); return true; } } };
  }
};
function teacher(i) {
  const st = LESSON.stages; cur = Math.max(0, Math.min(st.length - 1, i));
  stopSound(); if (ctrl.stop) ctrl.stop();
  app.innerHTML = `<div class="tbar"><span class="num">${cur + 1}</span><span class="name">${st[cur].name}</span><span class="min">${st[cur].min} min</span>
    <button class="ib btn" data-prev aria-label="Previous">${ICON.prev}</button><button class="ib btn" data-next aria-label="Next">${ICON.next}</button><button class="ib btn" data-fs aria-label="Full screen">${ICON.fs}</button><button class="ib wide btn" data-reset title="Empty the three race boards for the whole class">↺ Reset boards</button></div>
    <div class="prog">${st.map((s, k) => `<button class="${k === cur ? "cur" : k < cur ? "done" : ""}" aria-label="Stage ${k + 1}"></button>`).join("")}</div>
    <div class="tscreen" data-stage="${cur + 1}" data-game="${st[cur].game}"></div><div class="keys"></div>`;
  ctrl = STAGE_GAMES[st[cur].game]($(".tscreen", app), st[cur]) || {};
  $(".keys", app).textContent = (ctrl.keys ? ctrl.keys + " · " : "") + `1-${st.length}: stage · ←/→ · F: full screen`;
  $("[data-reset]", app).onclick = resetBoards;
  $("[data-prev]", app).onclick = prev; $("[data-next]", app).onclick = next; $("[data-fs]", app).onclick = toggleFS;
  $$(".prog button", app).forEach((b, k) => b.onclick = () => teacher(k));
  history.replaceState(null, "", "#teacher-" + (cur + 1));
}
// Reset boards posts a marker; every laptop ignores scores from before the newest marker.
async function resetBoards() {
  if (!confirm("Reset the River, Forest and Mountain race boards for the whole class?")) return;
  const btn = $("[data-reset]", app); if (btn) btn.disabled = true;
  let ok = false;
  try { const r = await fetch(boardUrl(), { method: "POST", body: JSON.stringify({ reset: 1, t: Date.now() }) }); ok = r.ok; } catch (e) {}
  lb.set({ own: [], cache: { at: 0, ok: false, msgs: [] } });
  toast(`<span style="font-size:40px">${ok ? "✅" : "📴"}</span><span><small>Race boards</small><b>${ok ? "Reset for the class" : "No internet: not reset"}</b></span>`);
  if (btn) btn.disabled = false;
}
function next() { if (ctrl.next && ctrl.next()) return; if (cur < LESSON.stages.length - 1) teacher(cur + 1); }
function prev() { if (ctrl.prev && ctrl.prev()) return; if (cur > 0) teacher(cur - 1); }
// The page knows it is full screen (the start page hides its Full screen button and hint).
addEventListener("fullscreenchange", () => document.body.classList.toggle("isfs", !!document.fullscreenElement));
const toggleFS = () => { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  ac();
  if (!/^#teacher/.test(location.hash)) return;
  const k = e.key;
  if ([" ", "Enter", "ArrowLeft", "ArrowRight"].includes(k)) e.preventDefault();
  if (k === "f" || k === "F") return toggleFS();
  if (/^[1-9]$/.test(k) && +k <= LESSON.stages.length) return teacher(+k - 1);
  if (k === "ArrowRight") return next();
  if (k === "ArrowLeft") return prev();
  if (k === " " || k === "Enter") { stopSound(); return ctrl.space && ctrl.space(); }
});

/* ---------- routes: the one Classroom link opens the start quiz; #level-1, #level-2 and #level-3 open River, Forest and
   Mountain directly (the teacher moves a kid with them); #teacher-N is the projector ---------- */
function route() {
  $$(".offer").forEach(x => x.remove()); stopSound(); onMiss = () => {};
  const h = location.hash, lv = /^#level-([123])$/.exec(h), tc = /^#teacher(?:-(\d+))?$/.exec(h);
  if (lv) return trail(+lv[1]);
  if (tc) return teacher((+tc[1] || 1) - 1);
  start();
}
addEventListener("hashchange", route);
route();
</script>
