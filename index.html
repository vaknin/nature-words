/* Trail colours: three nature colours of equal weight (blue water, green trees, grey-blue rock), so none reads as
   higher or lower; no traffic lights. */
:root{--ink:#1f2a3d;--muted:#5d6b82;--bg:#f4f8fb;--card:#fff;--line:#e3e9f1;
--river:#2f80ed;--river-d:#1c5fb8;--river-t:#e5f0ff;
--forest:#1f9d63;--forest-d:#157549;--forest-t:#e2f6ec;
--rock:#5b7a99;--rock-d:#405a75;--rock-t:#e8eef5;
--sun:#ffc83d;--ok:#1f9d63;--soft:#ff8a65;
--head:"Fredoka","Rubik",system-ui,sans-serif;--body:"Rubik","Fredoka",system-ui,sans-serif;
--r:24px;--shadow:0 1px 0 #fff inset,0 10px 30px #1f2a3d14,0 2px 6px #1f2a3d0f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0}
svg{display:block}
h1,h2,h3,.head{font-family:var(--head)}
.he{direction:rtl;unicode-bidi:isolate;font-family:var(--body)}
.btn{transition:transform .16s cubic-bezier(.3,1.4,.5,1),box-shadow .16s}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(2px) scale(.98)}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
.pop{animation:popIn .4s cubic-bezier(.3,1.6,.5,1)}
.shake{animation:shake .3s}
.rise{animation:rise .45s ease both}
#app{min-height:100vh;display:flex;flex-direction:column}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- shared pieces ---------- */
.primary{font-family:var(--head);font-weight:600;font-size:26px;background:var(--c,var(--river));color:#fff;border-radius:999px;padding:14px 38px;box-shadow:0 6px 0 var(--d,var(--river-d))}
.speaker{flex:none;width:56px;height:56px;border-radius:50%;background:var(--c,var(--river));display:grid;place-items:center;box-shadow:0 5px 0 var(--d,var(--river-d))}
.speaker svg{width:28px;height:28px}
.speaker.big{width:96px;height:96px}
.speaker.big svg{width:46px;height:46px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.say{display:flex;align-items:center;gap:16px;padding:14px 20px}
.say .en{font-family:var(--head);font-weight:600;font-size:26px}
.say .he{display:block;font-size:19px;color:var(--muted);margin-top:2px}

/* ---------- start: the nature map and the trail quiz ---------- */
.land{position:relative;flex:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;padding:24px}
.land .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.land>*:not(.scene){position:relative;z-index:1}
.hero{text-align:center;padding:26px 44px;background:#ffffffe8;backdrop-filter:blur(6px);border-radius:32px;box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:64px;font-weight:700;letter-spacing:.5px}
.hero p{margin:6px 0 0;font-size:24px;color:var(--muted)}
.hero .he{font-size:21px;color:var(--muted);margin-top:4px}
.hero .primary{margin-top:18px}
.trailtags{display:flex;gap:12px}
.tag{display:inline-flex;align-items:center;gap:8px;background:#ffffffe0;border-radius:999px;padding:6px 16px 6px 6px;font-family:var(--head);font-weight:600;font-size:20px}
.tag svg{width:36px;height:36px}
.quiz{width:min(960px,94vw);display:flex;flex-direction:column;gap:18px;padding:22px 28px;background:#ffffffee;border-radius:32px;box-shadow:var(--shadow)}
.qtop{display:flex;align-items:center;gap:14px}
.qtop h2{margin:0;font-size:30px;font-weight:600}
.steps{margin-left:auto;display:flex;gap:8px}
.steps i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--sun)}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 50px}
.result .badge{width:150px;height:150px}
.result h1{margin:0;font-size:54px}
.result p{margin:0;font-size:22px;color:var(--muted)}

/* ---------- a trail ---------- */
.trail{flex:1;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:18px 32px 24px;background:linear-gradient(180deg,var(--t) 0,var(--bg) 60%)}
.thead{display:flex;align-items:center;gap:14px}
.thead .pic{width:58px;height:58px}
.thead b{display:block;font-family:var(--head);font-weight:600;font-size:30px}
.thead .he{font-size:16px;color:var(--muted)}
.path{margin-left:auto;display:flex;align-items:center;gap:6px}
.path i{width:34px;height:10px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.path i.done{background:var(--c);box-shadow:none}
.path i.cur{background:var(--sun);box-shadow:none}
.stars{font-family:var(--head);font-weight:600;font-size:22px;background:#fff;border-radius:999px;padding:6px 16px;box-shadow:var(--shadow)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.big{width:250px;height:250px;background:#fff;border-radius:32px;padding:14px;box-shadow:var(--shadow)}
.big svg{width:100%;height:100%}
.choices{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:1000px}
.choice{background:#fff;border-radius:22px;box-shadow:0 0 0 3px var(--line),0 6px 0 var(--line);font-family:var(--head);font-weight:600;font-size:30px;padding:14px 26px;min-width:150px;display:flex;align-items:center;justify-content:center;gap:10px}
.choice.pic{padding:10px}
.choice.pic svg{width:150px;height:150px}
.choice .mini{width:40px;height:40px;border-radius:50%;background:var(--t);display:grid;place-items:center}
.choice .mini svg{width:22px;height:22px}
.choice.ok{box-shadow:0 0 0 4px var(--ok),0 6px 0 var(--ok)}
.slots,.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot,.tile{width:62px;height:74px;border-radius:16px;display:grid;place-items:center;font-family:var(--head);font-size:42px;font-weight:600}
.slot{background:#fff;box-shadow:inset 0 0 0 3px var(--line)}
.slot.f{box-shadow:inset 0 0 0 3px var(--ok);color:var(--ok)}
.slot.given{color:var(--muted)}
.tile{background:var(--c);color:#fff;box-shadow:0 5px 0 var(--d)}
.tile[disabled]{visibility:hidden}
.gap{font-family:var(--head);font-weight:600;font-size:38px;text-align:center;background:#fff;border-radius:24px;padding:18px 30px;box-shadow:var(--shadow)}
.gap u{display:inline-block;min-width:3.5em;text-decoration:none;border-bottom:5px solid var(--c)}
.cheer{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.cheer h2{margin:0;font-size:50px}
.next-trail{display:inline-flex;align-items:center;gap:10px}
.next-trail svg{width:40px;height:40px}
.offer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#1f2a3d66}
.offer .card{padding:28px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:620px}
.offer h2{margin:0;font-size:38px}
.offer .row{display:flex;gap:14px}
.ghost{font-family:var(--head);font-weight:600;font-size:22px;border-radius:999px;padding:12px 28px;background:#fff;box-shadow:inset 0 0 0 3px var(--line)}

/* ---------- points, combo, cards, race ---------- */
.hud{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:var(--shadow)}
.hud .lvl{background:var(--ink);color:#fff;border-radius:999px;padding:2px 10px;font-size:16px;font-weight:600}
.hud .xp{width:90px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.hud .xp i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ff8a3d);transition:width .4s}
.hud .pts{font-size:22px;font-weight:600;min-width:2.5em;text-align:right}
.hud .combo{font-size:18px;font-weight:600;color:var(--muted);opacity:.5}
.hud .combo.on{opacity:1;color:#e8590c;animation:popIn .3s}
.path i.race{width:auto;height:auto;background:none;box-shadow:none;font-style:normal;font-size:18px;opacity:.5}
.path i.race.cur{opacity:1}
.cards{display:flex;gap:8px;justify-content:center}
.wc{width:74px;background:#fff;border-radius:14px;padding:4px;text-align:center;box-shadow:inset 0 0 0 2px var(--line);font-family:var(--head);font-size:14px}
.wc svg{width:52px;height:52px;margin:auto;filter:grayscale(1);opacity:.25}
.wc.got{box-shadow:0 0 0 3px var(--sun),0 4px 12px #ffc83d55}
.wc.got svg{filter:none;opacity:1}
.float{position:absolute;font-size:40px;font-weight:700;color:#e8590c;pointer-events:none;animation:floatUp .9s ease-out forwards}
.stage{position:relative}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
.toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:22px;padding:12px 26px 12px 14px;box-shadow:0 14px 40px #1f2a3d55}
.toast svg{width:60px;height:60px}
.toast small{display:block;color:var(--sun);font-family:var(--head);font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.toast b{font-family:var(--head);font-size:30px}
.burst{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--sun) 19% 45%,transparent 46%),conic-gradient(from 0deg,var(--sun) 0 10deg,transparent 10deg 30deg,var(--sun) 30deg 40deg,transparent 40deg 60deg,var(--sun) 60deg 70deg,transparent 70deg 90deg,var(--sun) 90deg 100deg,transparent 100deg 120deg,var(--sun) 120deg 130deg,transparent 130deg 150deg,var(--sun) 150deg 160deg,transparent 160deg 180deg,var(--sun) 180deg 190deg,transparent 190deg 210deg,var(--sun) 210deg 220deg,transparent 220deg 240deg,var(--sun) 240deg 250deg,transparent 250deg 270deg,var(--sun) 270deg 280deg,transparent 280deg 300deg,var(--sun) 300deg 310deg,transparent 310deg 330deg,var(--sun) 330deg 340deg,transparent 340deg);animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.endrow{display:flex;gap:24px;align-items:stretch;justify-content:center}
.racecard{width:380px;border-radius:28px;padding:22px;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;
 background:radial-gradient(circle at 30% 0,#ffdf7a 0,transparent 45%),linear-gradient(160deg,#ff8a3d,#e8590c 55%,#b8380a);box-shadow:0 18px 40px #e8590c55}
.racecard h2{margin:0;font-size:30px}
.racecard .he{color:#fff;opacity:.9}
.rc-icons{display:flex;gap:6px;font-size:58px;line-height:1}
.rc-icons .watch{animation:tickTock 1s ease-in-out infinite}
@keyframes tickTock{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.rc-rec{background:#ffffff26;border-radius:16px;padding:4px 20px}
.rc-rec small{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.rc-rec b{font-family:var(--head);font-size:44px;line-height:1}
.race-go{background:#fff;color:#e8590c;box-shadow:0 6px 0 #b8380a}
.racebar{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:8px 18px;box-shadow:var(--shadow)}
.racebar .trophy{font-size:28px}
.clock{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.clock i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a3d,var(--sun))}
.rscore{font-size:26px}
.big-t{font-size:70px}
.cheer .row{display:flex;gap:12px}

/* ---------- Fable's additions: say game, flag, end, teacher screens ---------- */
.sayline{font-family:var(--head);font-size:56px;font-weight:600;line-height:1.1}
.sayline.sent{font-size:36px;font-weight:500;text-align:center;max-width:900px}
.sayline b{color:var(--c)}
.heword{font-size:26px;color:var(--muted)}
.rec{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.rec .primary.on{background:#e8590c;box-shadow:0 6px 0 #b8380a;animation:popIn .6s infinite alternate}
.ghost[disabled]{opacity:.4}
.flag{font-family:var(--head);font-weight:600;font-size:20px;background:var(--sun);border-radius:999px;padding:8px 18px;box-shadow:0 5px 0 #d9a21a;animation:popIn .5s}
.mark{font-size:26px;margin:0}
.cheer[data-done]{padding:26px 36px;max-width:520px}
.tplace{display:inline-flex;align-items:center;gap:10px}
.tp{width:48px;height:48px;display:inline-block}
.steps4 span{font-size:.85em}
.timer{width:min(1100px,92vw);display:flex;align-items:center;gap:16px}
.track{position:relative;flex:1;height:22px;border-radius:99px;background:var(--line)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--forest),var(--river))}
.walker{position:absolute;top:-30px;width:40px;font-size:32px;text-align:center}
.timer b{font-size:34px;min-width:3.2em}
.places{display:flex;gap:30px;justify-content:center}
.place{background:#fff;border-radius:30px;padding:16px;box-shadow:var(--shadow);text-align:center}
.place svg{width:min(34vmin,300px);height:min(34vmin,300px)}
.places.n4 .place svg{width:min(22vmin,220px);height:min(22vmin,220px)}
.place b{font-family:var(--head);font-size:clamp(28px,5vmin,52px)}
.wgrid .gone svg{visibility:hidden}
.wgrid .back{box-shadow:0 0 0 5px var(--sun)}
.wgrid span{display:block;min-height:1.2em}

/* ---------- rewards and race, Fable's follow-up ---------- */
.chip{font-weight:600;font-size:16px;border-radius:999px;padding:6px 12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}
.chip.open{background:linear-gradient(160deg,#ff8a3d,#e8590c);color:#fff;box-shadow:0 4px 0 #b8380a;cursor:pointer}
.hud .combo.fire{color:#fff;background:#e8590c;border-radius:999px;padding:2px 10px;opacity:1}
.wc i{display:block;font-style:normal;font-size:12px;color:var(--sun);letter-spacing:1px}
.wc.gold svg{filter:none;opacity:1}
.wc.gold{background:linear-gradient(160deg,#fff6d6,#ffe08a);box-shadow:0 0 0 3px var(--sun),0 4px 14px #ffc83d88}
.choice.bad{box-shadow:0 0 0 4px var(--soft),0 6px 0 var(--soft);opacity:.6}
.count{font-size:140px;font-weight:700;color:#e8590c;animation:popIn .4s}
.rc-nums{display:flex;gap:12px}
.rc-win{margin:0;font-size:22px}
.stage.comeback::before{content:"↺";position:absolute;top:-6px;right:8px;font-size:28px;color:var(--muted)}

/* ---------- teacher (projector) ---------- */
.tbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;box-shadow:0 1px 0 var(--line)}
.tbar .num{display:grid;place-items:center;min-width:44px;height:44px;border-radius:999px;background:var(--river);color:#fff;font-family:var(--head);font-weight:600;font-size:24px}
.tbar .name{flex:1;font-family:var(--head);font-size:28px;font-weight:600}
.tbar .min{font-weight:600;color:var(--muted)}
.tbar .ib{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.tbar .ib svg{width:24px;height:24px}
.prog{display:flex;gap:6px;padding:8px 16px 0}
.prog button{flex:1;height:10px;border-radius:99px;background:var(--line)}
.prog button.done{background:#9cc2f5}
.prog button.cur{background:var(--river)}
.tscreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;min-height:calc(100vh - 100px)}
.title{font-family:var(--head);font-size:clamp(48px,9vmin,110px);font-weight:700;margin:0;text-align:center;line-height:1.05}
.sub{font-size:clamp(22px,4vmin,44px);font-weight:500;margin:0;text-align:center;color:var(--muted)}
.agenda{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-family:var(--head);font-size:clamp(18px,3vmin,30px);font-weight:600}
.agenda span{background:#fff;border-radius:999px;padding:8px 20px;box-shadow:var(--shadow)}
.wcard{display:flex;flex-direction:column;align-items:center;gap:10px}
.wcard .big{width:min(50vmin,360px);height:min(50vmin,360px)}
.wcard .w{font-family:var(--head);font-size:clamp(64px,12vmin,140px);font-weight:700;visibility:hidden;line-height:1}
.wcard .w.show{visibility:visible;animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
.wcard .g{font-size:clamp(20px,3vmin,30px);color:var(--muted);font-weight:500}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.wgrid div{background:#fff;border-radius:22px;padding:10px;box-shadow:var(--shadow);text-align:center;font-family:var(--head);font-weight:600;font-size:clamp(20px,3vmin,32px)}
.wgrid svg{width:min(17vmin,150px);height:min(17vmin,150px);margin:auto}
.keys{position:fixed;right:14px;bottom:8px;font-size:13px;color:#98a3b5;font-weight:500;pointer-events:none}
</style>

<body>
<div id="app"></div>
<canvas id="confetti"></canvas>
<script>
/* =====================================================================
   LESSON: all content lives here. Change words, lines, stages and trails in this block only.
   ===================================================================== */
const LESSON = {
  title: "Nature Words",
  goal: "I can say, read and spell eight nature words.",
  // The eight words in Fable's teaching order: look-alike meanings kept apart (river/sea, forest/grass).
  // gesture: the teacher's hint in "Meet the words".
  words: [
    { id: "nature",   he: "טבע",   gesture: "open your arms wide" },
    { id: "mountain", he: "הר",    gesture: "hands meet in a peak" },
    { id: "river",    he: "נהר",   gesture: "hand swims like a snake" },
    { id: "forest",   he: "יער",   gesture: "arms up like trees" },
    { id: "sea",      he: "ים",    gesture: "big waves with both arms" },
    { id: "grass",    he: "דשא",   gesture: "wiggle your fingers low" },
    { id: "air",      he: "אוויר", gesture: "blow on your hand" },
    { id: "dry",      he: "יבש",   gesture: "wipe your forehead" }
  ],
  // One sentence per word with three wrong options that cannot fit (Fable's list), for the gap questions and Mountain's say game.
  sentences: {
    air:      ["Birds fly in the ___.", ["sea", "grass", "river"]],
    dry:      ["No water! The river is ___.", ["sea", "air", "forest"]],
    forest:   ["A ___ has many trees.", ["sea", "air", "river"]],
    grass:    ["Cows eat green ___.", ["air", "river", "mountain"]],
    mountain: ["We go up the ___.", ["sea", "grass", "air"]],
    nature:   ["I love ___: rivers, forests and mountains.", ["dry", "air", "grass"]],
    river:    ["The ___ goes to the sea.", ["grass", "forest", "air"]],
    sea:      ["We swim in the big blue ___.", ["grass", "forest", "mountain"]]
  },
  // Teacher's projector stages, Fable's six (4+8+5+18+4+4 = 43 min). The smoke test holds them to 6 stages and 40-45 minutes.
  stages: [
    { name: "Welcome to nature", min: 4,  game: "intro" },
    { name: "Meet the words",    min: 8,  game: "meet" },
    { name: "Quiz time",         min: 5,  game: "quiz" },
    { name: "Play and race",     min: 18, game: "work" },
    { name: "Let's go!",         min: 4,  game: "letsgo" },
    { name: "What's missing?",   min: 4,  game: "missing" }
  ],
  // The three levels. Kids never read "trail" or easy/hard: an icon, one easy word and a Hebrew line.
  trails: [
    { id: 1, name: "River",    emoji: "🌊", heName: "נהר", pic: "river",    c: "var(--river)",  d: "var(--river-d)",  t: "var(--river-t)" },
    { id: 2, name: "Forest",   emoji: "🌲", heName: "יער", pic: "forest",   c: "var(--forest)", d: "var(--forest-d)", t: "var(--forest-t)" },
    { id: 3, name: "Mountain", emoji: "⛰️", heName: "הר",  pic: "mountain", c: "var(--rock)",   d: "var(--rock-d)",   t: "var(--rock-t)" }
  ],
  // Four games in the same order on every trail (repetition → recognition → reproduction), harder on each trail.
  //  say: hear it, say it to the laptop, hear yourself.   listen: hear a word, press its picture or written word.
  //  picword: picture → word.   gap: sentence with a gap → word.   build: letter tiles.
  // options: how many to choose from; hear: a speaker on each word; heWord: the Hebrew word shown; given: letters filled in;
  // extra: wrong letters added; recSec: recording length (3 s holds one word, 6 s one short sentence).
  games: {
    1: [
      { type: "say",     heWord: true, recSec: 3, say: "Listen. Say the word.", he: "הקשיבו ואמרו את המילה." },
      { type: "listen",  options: 3, show: "pic", say: "Listen. Press the picture.", he: "הקשיבו ולחצו על התמונה." },
      { type: "picword", options: 3, hear: true, say: "Look. Press the word.", he: "הסתכלו בתמונה ולחצו על המילה." },
      // River builds the short words first (air, sea, dry before mountain), Fable's idea 14.
      { type: "build",   given: 1, shortFirst: true, say: "Build the word.", he: "בנו את המילה." }
    ],
    2: [
      { type: "say",     heWord: true, recSec: 3, say: "Listen. Say the word.", he: "הקשיבו ואמרו את המילה." },
      { type: "listen",  options: 6, show: "pic", say: "Listen. Press the picture.", he: "הקשיבו ולחצו על התמונה." },
      { type: "picword", options: 4, say: "Look. Press the word.", he: "הסתכלו בתמונה ולחצו על המילה." },
      { type: "build",   given: 0, say: "Build the word.", he: "בנו את המילה." }
    ],
    3: [
      { type: "say",     heWord: true, sentence: true, mute: true, recSec: 6, say: "Read. Say the sentence.", he: "אמרו את המשפט." },
      { type: "listen",  options: 6, show: "word", say: "Listen. Press the word.", he: "הקשיבו ולחצו על המילה." },
      { type: "gap",     mute: true, say: "Read. Press the missing word.", he: "קראו ולחצו על המילה החסרה." },
      { type: "build",   given: 0, extra: 2, hideSound: true, say: "Build the word.", he: "בנו את המילה." }
    ]
  },
  // Last check per trail: four questions on four different words, first try counts (Fable's exit check).
  check: {
    1: [{ type: "listen", options: 3, show: "pic" }, { type: "listen", options: 3, show: "pic" }, { type: "picword", options: 3, hear: true }, { type: "build", given: 1 }],
    2: [{ type: "listen", options: 6, show: "pic" }, { type: "picword", options: 4 }, { type: "picword", options: 4 }, { type: "build", given: 0 }],
    3: [{ type: "listen", options: 6, show: "word" }, { type: "gap" }, { type: "gap" }, { type: "build", given: 0, extra: 2, hideSound: true }],
    // The flag shows 11 minutes after the reveal even mid-game, leaving every kid about five minutes for the race in the 18-minute stage.
    flagMinutes: 11
  },
  // The start quiz (Fable): 2 listening warm-ups, 4 word questions, 2 sentence questions; each word is the answer once.
  quiz: {

    questions: [
      { type: "listen",  word: "sea",      options: 3, show: "pic", part: "warm" },
      { type: "listen",  word: "mountain", options: 3, show: "pic", part: "warm" },
      { type: "picword", word: "forest",   options: 4, part: "word" },
      { type: "picword", word: "grass",    options: 4, part: "word" },
      { type: "listen",  word: "river",    options: 6, show: "word", part: "word" },
      { type: "listen",  word: "dry",      options: 6, show: "word", part: "word" },
      { type: "gap",     word: "air",      part: "sent" },
      { type: "gap",     word: "nature",   part: "sent" }
    ],
    // Mountain: both sentences and 3 of 4 words; Forest: 3 of 4 words; else River. It places lower when in doubt:
    // a non-reader reaches Forest by luck about 3% of the time (Fable), against 61% under a thirds rule.
    wordsFor: 3, sentsFor: 2
  },
  // Offers to move: 5 first tries in a row up, 3 questions in a row with a miss down; once per direction per trail,
  // the streak carries across games, never in the quiz or the Last check. Offers are silent (no clip).
  streak: { up: 5, down: 3 },
  // Rewards (Fable's set): nothing random, nothing ever taken away, no timer outside the race. Tune here.
  points: {
    // Say a word +5; right first try +10; right after a miss +5, so a kid who needs two tries still earns.
    perSay: 5, perRight: 10, perRetry: 5,
    // Combo: x2 from 3 in a row, x3 from 5 in a row; a miss resets it and takes nothing.
    combo: [[5, 3], [3, 2]],
    // Level 2 at 50 points, then one per 100: a weak kid still levels up two or three times, a strong kid about six.
    firstLevel: 50, perLevel: 100,
    // A toast stays 1.6 s: long enough to read one word, short enough not to block the next round.
    toastMs: 1600
  },
  // The race (Fable): after the Last check, the same for every place, picture -> 1 of 4 words, one press per question.
  race: {
    // 30 s: in a 5-minute race window about eight tries, so more kids see "New best!".
    seconds: 30, options: 4,
    // A wrong press shows the answer and freezes 1 s, so pressing everything never pays.
    freezeMs: 1000, nextMs: 300,
    // +5 per right answer, no combo; +50 for a new best.
    perRight: 5, newBest: 50,
    // The score to beat with no shared board: Aviv's own run sets it (Fable's fallback; many kids can beat a fixed score).
    teacher: 12,
    // Three countdown beeps before GO, and a tick in the last five seconds.
    countdown: 3, tickFrom: 5
  },
  // Kid-facing words (Fable's table): never "trail", never easy/hard; the Hebrew line sits under each instruction,
  // never inside a question or its answers. "Start at River", not "You are River": a start is not an identity.
  text: {

/* All phrases the site can speak: [text, voice]. Words in both voices (the kids hear a boy and a girl);
   every other line in one voice, boy and girl taking turns. tools/voices.py records exactly this list. */
function PHRASES(L) {
  const out = [];
  for (const w of L.words) out.push([w.id, "boy"], [w.id, "girl"]);
  // Fable's six spoken lines; everything else is text only (Mountain's reading lines, quiz, reveal, check, race).
  const lines = [];
  for (const k of Object.keys(L.games)) for (const g of L.games[k]) if (!g.mute && !lines.includes(g.say)) lines.push(g.say);
  lines.push(L.text.wellDone);
  lines.forEach((t, i) => out.push([t, i % 2 ? "girl" : "boy"]));
  return out;
}

  const t = trailOf(to);
  const el = document.createElement("div"); el.className = "offer";
  el.innerHTML = `<div class="card pop" style="${trailVars(t)}"><div class="big" style="width:140px;height:140px">${ART[t.pic]}</div><h2>${line(t)}</h2>${heLine(he(t))}
    <div class="row"><button class="primary btn" data-yes>${t.name} ${t.emoji} ▶</button><button class="ghost btn" data-no>${T.stay}</button></div></div>`;
  document.body.appendChild(el);
  // Accepting lands on the same game number in the new place; points and cards stay.
  $("[data-yes]", el).onclick = () => { el.remove(); store.set({ trail: to, game: gi }); location.hash = "level-" + to; };
  $("[data-no]", el).onclick = () => { el.remove(); stay && stay(); };
}
function lastCheck(t) {
  const qs = LESSON.check[t.id], words = shuffle(WIDS).slice(0, qs.length);
  let k = 0, right = 0;
  store.set({ game: LESSON.games[t.id].length });
  delete app.dataset.ended;
  app.innerHTML = shell(t, `<div class="card say"><div><span class="en">🏁 ${T.flag}</span>${heLine(T.heFlag)}</div></div><div class="stage"></div>`, LESSON.games[t.id].length);
  $(".trail", app).dataset.game = "check"; bindChip();
  const box = $(".stage", app);
  const ask = () => {
    if (k >= qs.length) { store.set({ checked: right }); return trailEnd(t, right, qs.length); }
    // First try counts, as in the quiz: a miss moves on, and the check never triggers an offer.
    onMiss = () => { onMiss = () => {}; missed(); k++; setTimeout(ask, 500); };
    round(box, qs[k], words[k], ok => { onMiss = () => {}; if (ok) { right++; award(words[k], qs[k].type, true); } k++; setTimeout(ask, S.nextMs); });
  };
  ask();
}
const best = () => store.get().best || 0;
function raceCard() {
  return `<div class="racecard pop" data-racecard>
      <div class="rc-icons"><span class="trophy">🏆</span><span class="watch">⏱️</span></div>
      <h2 class="head">${T.race} ⏱ ${RC.seconds} s</h2><p class="head rc-win">${T.raceWin}</p>${heLine(T.heRace(RC.seconds))}
      <div class="rc-nums"><div class="rc-rec"><small>${T.top}</small><b data-record>${Math.max(RC.teacher, best())}</b><small>${best() > RC.teacher ? "you" : "Teacher"}</small></div>
      <div class="rc-rec"><small>${T.best}</small><b data-best>${best()}</b></div></div>
      <button class="primary btn race-go" data-race>${T.go}</button>
    </div>`;
}
// The end: the score and "Mark as done", the race card, and the next place.
function trailEnd(t, right, of) {
  if (right === undefined) { right = store.get().checked || 0; of = LESSON.check[t.id].length; }
  const nx = trailOf(t.id + 1);
  onMiss = () => {};
  app.innerHTML = shell(t, `<div class="stage"><div class="endrow">
    <div class="cheer card pop" data-done><h2>${T.done(right, of)}</h2>
      <p class="head mark">${T.markDone}</p>${heLine(T.heMarkDone)}
      ${nx ? `<button class="primary btn next-trail" data-next style="${trailVars(nx)}">${ART[nx.pic]} ${T.next(nx)} ▶</button>` : ""}
    </div>${raceCard()}</div></div>`, LESSON.games[t.id].length);
  app.dataset.ended = "1"; confetti(); speak(T.wellDone); bindChip();
  $("[data-race]", app).onclick = () => race(t);
  if (nx) $("[data-next]", app).onclick = () => { store.set({ trail: nx.id, game: 0 }); location.hash = "level-" + nx.id; };
}
// The race: the same for every place. Picture -> 1 of 4 words; one press per question; a wrong press shows the answer
// and freezes 1 s. The eight words come in shuffled sets, so no word repeats until all eight have come.
function race(t) {
  let score = 0, alive = false, deck = [], t0 = 0, lastTick = -1;
  delete app.dataset.ended; onMiss = () => {};
  app.innerHTML = shell(t, `<div class="racebar"><span class="trophy">🏆</span><b class="head">${T.top} ${Math.max(RC.teacher, best())}</b>
    <div class="clock"><i data-clock></i></div><span class="head rscore">⚡ <b data-score>0</b></span></div><div class="stage"></div>`, LESSON.games[t.id].length);
  $(".trail", app).dataset.game = "race";
  const box = $(".stage", app), clock = $("[data-clock]", app);
  const nextWord = () => { if (!deck.length) deck = shuffle(WIDS); return deck.pop(); };
  const ask = () => {
    if (!alive) return;
    const w = nextWord(), opts = shuffle([w, ...shuffle(WIDS.filter(x => x !== w)).slice(0, RC.options - 1)]);
    box.dataset.answer = w; box.dataset.type = "race";
    box.innerHTML = `<div class="big">${ART[w]}</div><div class="choices">${opts.map(o => `<button class="choice btn" data-w="${o}">${o}</button>`).join("")}</div>`;
    $$(".choice", box).forEach(b => b.onclick = () => {
      $$(".choice", box).forEach(x => x.onclick = null);
      if (b.dataset.w === w) { b.classList.add("ok"); score++; $("[data-score]", app).textContent = score; SFX.ok(score); addPoints(RC.perRight); setTimeout(ask, RC.nextMs); }
      else { SFX.no(); b.classList.add("bad"); $(`.choice[data-w="${w}"]`, box).classList.add("ok"); setTimeout(ask, RC.freezeMs); }
    });
  };
  const tick = () => {
    if (!alive || !clock.isConnected) return;
    const left = Math.max(0, RC.seconds - (performance.now() - t0) / 1000);
    clock.style.width = (100 * left / RC.seconds) + "%";
    const s = Math.ceil(left); if (s <= RC.tickFrom && s !== lastTick && s > 0) { lastTick = s; SFX.tick(); }
    if (left <= 0) return end();
    requestAnimationFrame(tick);
  };
  const end = () => {
    alive = false; SFX.horn();
    const isBest = score > best();
    if (isBest) store.set({ best: score });
    box.innerHTML = `<div class="cheer card pop" data-raceend><span class="trophy big-t">🏆</span><h2>${isBest ? T.newBest(score) : T.timeUp(score)}</h2>${heLine(T.heEnd)}
      <div class="row"><button class="primary btn" data-again>${T.again}</button><button class="ghost btn" data-back>${T.back}</button></div>${heLine(T.heAgain)}</div>`;
    if (isBest) { addPoints(RC.newBest); confetti(200); }
    app.dataset.ended = "1";
    $("[data-again]", app).onclick = () => race(t);
    $("[data-back]", app).onclick = () => trailEnd(t);
  };
  // Countdown: three beeps, then GO.
  let c = RC.countdown;
  box.innerHTML = `<div class="count head" data-count>${c}</div>`; SFX.beep();
  const cd = setInterval(() => {
    if (!box.isConnected) return clearInterval(cd);
    c--; if (c > 0) { $("[data-count]", box).textContent = c; SFX.beep(); return; }
    clearInterval(cd); SFX.go(); alive = true; t0 = performance.now(); requestAnimationFrame(tick); ask();
  }, 1000);
}

/* =====================================================================
   TEACHER: projector stages, keys 1-N, arrows, Space/Enter, F
   ===================================================================== */
let cur = 0, ctrl = {};
const STAGE_GAMES = {
  intro(el) {
    el.innerHTML = `<h1 class="title">${T.welcome}</h1><p class="sub">${LESSON.goal}</p><div class="agenda">${LESSON.stages.map((s, i) => `<span>${i + 1}. ${s.name}</span>`).join("")}</div>`;
    return { static: true };
  },
  // One word at a time (Space shows and says it), then a ninth slide with all eight pictures and no words for Show me! / Say it!
  meet(el) {
    let k = 0, shown = false;
    const show = () => {
      shown = false;
      if (k === W.length) { el.innerHTML = `<div class="wgrid">${W.map(w => `<div data-w="${w.id}">${ART[w.id]}</div>`).join("")}</div><p class="sub">Show me! · Say it!</p>`; el.dataset.item = "all"; return; }
      const w = W[k]; el.dataset.item = w.id;
      el.innerHTML = `<div class="wcard"><div class="big pop">${ART[w.id]}</div><div class="w">${w.id}</div><div class="g">✋ ${w.gesture}</div><div class="agenda"><span>${k + 1} / ${W.length}</span></div></div>`;
    };
    const reveal = () => { const e = $(".w", el); if (!e) return; e.classList.add("show"); shown = true; speak(W[k].id); };
    show();
    return { keys: "Space: show and say · →: next word", space: () => k === W.length ? null : shown ? speak(W[k].id) : reveal(),
      next: () => { if (k < W.length) { k++; show(); return true; } }, prev: () => { if (k > 0) { k--; show(); return true; } } };
  },
  quiz(el) {
    el.innerHTML = `<h1 class="title">Quiz time!</h1><div class="agenda">${LESSON.trails.map(t => `<span class="tplace"><span class="tp">${ART[t.pic]}</span>${t.name}</span>`).join("")}</div>
      <div class="agenda steps4"><span>1 · Open your laptop</span><span>2 · Classroom → Nature Words</span><span>3 · Press the link</span><span>4 · 🎧 Start</span></div>`;
    return { static: true };
  },
  // The word wall while kids work, with the 16-minute bar moving left to right (Space starts and stops it).
  work(el, st) {
    const total = st.min * 60;
    el.innerHTML = `<div class="wgrid">${W.map(w => `<div>${ART[w.id]}${w.id}</div>`).join("")}</div>
      <div class="timer"><div class="track"><i data-bar></i><span class="walker" data-walker>🥾</span></div><b class="head" data-left>${st.min}:00</b></div>`;
    let run = false, used = 0, last = 0, raf = 0;
    const bar = $("[data-bar]", el), walker = $("[data-walker]", el), lab = $("[data-left]", el);
    const draw = () => {
      const f = Math.min(1, used / total), left = Math.max(0, Math.ceil(total - used));
      bar.style.width = (100 * f) + "%"; walker.style.left = `calc(${100 * f}% - ${f * 40}px)`;
      lab.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    };
    const loop = ts => { if (!run) return; used += (ts - last) / 1000; last = ts; draw(); if (used < total) raf = requestAnimationFrame(loop); };
    draw();
    return { static: true, keys: "Space: start / stop the timer", space: () => { run = !run; if (run) { last = performance.now(); raf = requestAnimationFrame(loop); } },
      stop: () => { run = false; cancelAnimationFrame(raf); } };
  },
  // "Let's go to the ___!": two places, two places, then all four.
  letsgo(el) {
    const slides = [["sea", "mountain"], ["river", "forest"], ["sea", "mountain", "river", "forest"]];
    let k = 0;
    const show = () => { el.dataset.item = String(k); el.innerHTML = `<h1 class="title">Let's go to the ___!</h1><div class="places n${slides[k].length}">${slides[k].map(w => `<div class="place pop">${ART[w]}<b>${w}</b></div>`).join("")}</div>`; };
    show();
    return { next: () => { if (k < slides.length - 1) { k++; show(); return true; } }, prev: () => { if (k > 0) { k--; show(); return true; } } };
  },
  // What's missing? Space hides one picture; Space again brings it back with its word and clip. Five rounds, then the summary.
  missing(el) {
    // Four rounds (Fable) leave time in the 4 minutes for the race shout-out and the sum-up.
    const ROUNDS = 4;
    let k = 0, hidden = null, summary = false;
    const grid = () => `<div class="wgrid">${W.map(w => `<div data-w="${w.id}" class="${w.id === hidden ? "gone" : ""}">${ART[w.id]}<span>${w.id === hidden ? "?" : ""}</span></div>`).join("")}</div>`;
    const show = () => { el.dataset.item = summary ? "summary" : String(k); el.innerHTML = summary
      ? `<h1 class="title">✓ ${LESSON.goal}</h1><div class="agenda">${W.map(w => `<span>${w.id}</span>`).join("")}</div><p class="sub">Classroom → Mark as done</p>`
      : `<h1 class="title">What's missing?</h1>${grid()}<div class="agenda"><span>${k + 1} / ${ROUNDS}</span></div>`; };
    const space = () => {
      if (summary) return;
      if (!hidden) { hidden = shuffle(WIDS)[0]; show(); return; }
      const w = hidden; hidden = null; show(); const c = $(`[data-w="${w}"]`, el); c.classList.add("back"); $("span", c).textContent = w; speak(w);
    };
    const next = () => { if (summary) return false; if (k < ROUNDS - 1) { k++; hidden = null; show(); return true; } summary = true; show(); return true; };
    show();
    return { keys: "Space: hide / show", space, next, prev: () => { if (summary) { summary = false; show(); return true; } if (k > 0) { k--; hidden = null; show(); return true; } } };
  }
};
function teacher(i) {
  const st = LESSON.stages; cur = Math.max(0, Math.min(st.length - 1, i));
  stopSound(); if (ctrl.stop) ctrl.stop();
  app.innerHTML = `<div class="tbar"><span class="num">${cur + 1}</span><span class="name">${st[cur].name}</span><span class="min">${st[cur].min} min</span>
    <button class="ib btn" data-prev aria-label="Previous">${ICON.prev}</button><button class="ib btn" data-next aria-label="Next">${ICON.next}</button><button class="ib btn" data-fs aria-label="Full screen">${ICON.fs}</button></div>
    <div class="prog">${st.map((s, k) => `<button class="${k === cur ? "cur" : k < cur ? "done" : ""}" aria-label="Stage ${k + 1}"></button>`).join("")}</div>
    <div class="tscreen" data-stage="${cur + 1}" data-game="${st[cur].game}"></div><div class="keys"></div>`;
  ctrl = STAGE_GAMES[st[cur].game]($(".tscreen", app), st[cur]) || {};
  $(".keys", app).textContent = (ctrl.keys ? ctrl.keys + " · " : "") + `1-${st.length}: stage · ←/→ · F: full screen`;
  $("[data-prev]", app).onclick = prev; $("[data-next]", app).onclick = next; $("[data-fs]", app).onclick = toggleFS;
  $$(".prog button", app).forEach((b, k) => b.onclick = () => teacher(k));
  history.replaceState(null, "", "#teacher-" + (cur + 1));
}
function next() { if (ctrl.next && ctrl.next()) return; if (cur < LESSON.stages.length - 1) teacher(cur + 1); }
function prev() { if (ctrl.prev && ctrl.prev()) return; if (cur > 0) teacher(cur - 1); }
const toggleFS = () => { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  ac();
  if (!/^#teacher/.test(location.hash)) return;
  const k = e.key;
  if ([" ", "Enter", "ArrowLeft", "ArrowRight"].includes(k)) e.preventDefault();
  if (k === "f" || k === "F") return toggleFS();
  if (/^[1-9]$/.test(k) && +k <= LESSON.stages.length) return teacher(+k - 1);
  if (k === "ArrowRight") return next();
  if (k === "ArrowLeft") return prev();
  if (k === " " || k === "Enter") { stopSound(); return ctrl.space && ctrl.space(); }
});

/* ---------- routes: the one Classroom link opens the start quiz; #level-1, #level-2 and #level-3 open River, Forest and
   Mountain directly (the teacher moves a kid with them); #teacher-N is the projector ---------- */
function route() {
  $$(".offer").forEach(x => x.remove()); stopSound(); onMiss = () => {};
  const h = location.hash, lv = /^#level-([123])$/.exec(h), tc = /^#teacher(?:-(\d+))?$/.exec(h);
  if (lv) return trail(+lv[1]);
  if (tc) return teacher((+tc[1] || 1) - 1);
  start();
}
addEventListener("hashchange", route);
route();
</script>
