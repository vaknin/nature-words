[package]
name = "lesson-server"
version = "0.1.0"
edition = "2021"
description = "Our lesson server, general for every lesson: kids sign in with a class code, their name and a secret picture; their records; the race boards (ntfy-shaped); the lesson pages."

[dependencies]
# bundled: SQLite is compiled in, so the server needs nothing installed beside it.
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
# Cloudflare Access tokens (access.rs): RS256 is RSA PKCS#1 v1.5 over SHA-256; the JWT parts are base64url.
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"

[profile.release]
strip = true
